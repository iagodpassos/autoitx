name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GUI tests need a controllable desktop session and, on macOS, an
      # Accessibility grant. Runners have neither, so those stay #[ignore]d
      # and AUTOITX_GUI_TESTS is left unset.
      - run: cargo test --all-features
      # And again with no features. On macOS this is the only configuration
      # that compiles and exercises the *native* backend: `mock-loader`
      # selects the DLL backend, so `--all-features` alone would leave the
      # macOS code untested.
      - run: cargo test

  cross-check:
    name: cross-check macOS → Windows
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The load-bearing guarantee of this project: the Windows backend is fully
      # type-checked without a linker, a Windows machine, or the licensed DLL.
      - run: cargo clippy --target x86_64-pc-windows-gnu --all-features -- -D warnings

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  docs:
    name: docs.rs render (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Once per target, matching the docs.rs metadata.
      #
      # A single build cannot render both platforms: `--cfg docsrs` can switch
      # a module on, but it cannot conjure the objc2 crates onto a Linux host,
      # because they are declared under a macOS target dependency table. So
      # docs.rs builds each target separately and so does this.
      - run: cargo doc --no-deps --all-features --target ${{ matrix.target }}
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
