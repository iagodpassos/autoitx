[package]
name = "autoitx-sys"
description = "Raw FFI bindings to the AutoItX3 DLL (AU3_* C ABI), loaded at runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []
# Allow `Au3::load_from` to open ANY shared library on ANY OS, so the mock DLL
# can be exercised from macOS. Without it, loading is Windows-only.
mock-loader = []

[dependencies]
libloading = { workspace = true }

[target.'cfg(windows)'.dependencies]
widestring = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
