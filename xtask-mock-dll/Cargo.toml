[package]
name = "xtask-mock-dll"
description = "A stand-in for AutoItX3.dll that records calls, so the Windows FFI layer can be tested from any OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# `cdylib` so this builds as a .dylib on macOS and a .dll on Windows. The
# loader in autoitx-sys is OS-agnostic; only the default DLL *search paths* are
# Windows-specific. That is what lets `cargo test` exercise all 117 AU3
# signatures on a Mac, with no Windows and no licensed DLL in sight.
# `cdylib` is what gets loaded; `rlib` exists so `autoitx-sys` can name this
# crate as a dev-dependency, which is what makes Cargo build the cdylib before
# running the tests that load it. (A dev-dependency cycle is legal — only the
# normal dependency graph has to be acyclic.)
crate-type = ["cdylib", "rlib"]

[dependencies]
# For the AU3 types and, crucially, the `au3_functions!` list: the mock is
# generated from the same declarations as the real bindings, so it cannot drift.
autoitx-sys = { workspace = true }

[lints]
workspace = true
