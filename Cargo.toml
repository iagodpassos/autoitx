[workspace]
resolver = "3"
members = ["autoitx-sys", "autoitx", "xtask-mock-dll"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iagodpassos/autoitx"
authors = ["Iago Passos <iago.dpassos@gmail.com>"]
# Five is the crates.io maximum. `macos` earns its place over `gui`: that
# keyword is owned by GUI *frameworks*, and someone browsing it wants to build
# an interface, not drive somebody else's. `macos` next to `windows` is the one
# thing that distinguishes this from every other AutoIt binding.
keywords = ["automation", "autoit", "rpa", "windows", "macos"]
categories = ["api-bindings", "os", "os::windows-apis", "os::macos-apis"]

[workspace.dependencies]
autoitx-sys = { version = "0.1.1", path = "autoitx-sys" }

# `libloading` 0.9 raises the MSRV to 1.88; 0.8.x stays compatible with ours.
libloading = "0.8.9"
thiserror = "2.0"
parking_lot = "0.12"
bitflags = "2.9"
tracing = "0.1"

# Windows-only
widestring = "1.2"

# macOS-only. All from the objc2 project, versioned together.
# `libc` joins them for the parts of the process API that are POSIX rather than
# Cocoa: signals, priorities, and the `libproc` process listing.
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
