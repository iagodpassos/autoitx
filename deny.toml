[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive only. A copyleft dependency would make this crate unusable in the
# commercial RPA settings it is built for.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A versionless `path` dependency inside this workspace is not the supply-chain
# hazard `wildcards` exists to catch — it resolves to a sibling crate in this
# repository, never to whatever the registry happens to hold. Used for the
# mock-DLL dev-dependency.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
